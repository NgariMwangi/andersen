services:
  web:
    env_file:
      - .env.production
    restart: unless-stopped
    build: .
    container_name: andersen
    environment:
      FLASK_ENV: production
      SECRET_KEY: jtyjxdnjncdkm
      DATABASE_URL: postgresql://postgres:deno0707@172.17.0.1:5432/andersen
      # Required when users access the app over plain HTTP (e.g. http://IP:5002).
      # Set to true only behind HTTPS (see APP_BASE_URL=https://...).
      SESSION_COOKIE_SECURE: "false"
      APP_BASE_URL: https://hrms.nexusafrica.co.ke
      BREVO_SENDER_EMAIL: hrms@nexusafrica.co.ke
      BREVO_SENDER_NAME: Andersen HRMS
      SALARY_BASIS: annual
      SESSION_LIFETIME_HOURS: "2"
      # Persistent document roots (host folders must exist beside the repo)
      EMPLOYEE_UPLOADS_ROOT: /employeeuploads
      UPLOAD_FOLDER: /app/uploads
      LOG_DIR: /app/logs
    ports:
      - "5002:5002"
    volumes:
      # Employee profile documents (contracts, IDs, employee self-uploads)
      - ../employeeuploads:/employeeuploads
      # Leave supporting docs, local employee photos, legacy upload paths
      - ../hrms_uploads:/app/uploads
      # App logs (optional but survives rebuilds)
      - ../hrms_logs:/app/logs
    # Optional: mount app/static to provide logo.jpg without rebuilding
    #   - ./app/static:/app/app/static:ro
